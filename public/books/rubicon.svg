<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-label="Rubicon by Tom Holland">
  <rect width="600" height="900" fill="#1a3a3a"/>
  <rect x="40" y="40" width="520" height="820" fill="none" stroke="#e8b94a" stroke-width="2"/>
  <text x="300" y="160" text-anchor="middle" fill="#e8b94a" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="6">TOM HOLLAND</text>
  <text x="300" y="430" text-anchor="middle" fill="#f5f0e0" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="600" letter-spacing="-2">Rubicon</text>
  <line x1="230" y1="480" x2="370" y2="480" stroke="#e8b94a" stroke-width="3"/>
  <foreignObject x="90" y="520" width="420" height="240">
    <div xmlns="http://www.w3.org/1999/xhtml" style="color:#e8b94a;font-family:Georgia,'Times New Roman',serif;font-size:34px;line-height:1.3;font-style:italic;text-align:center;">The Last Years of the Roman Republic</div>
  </foreignObject>
</svg>
